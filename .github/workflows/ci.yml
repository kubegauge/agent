# ci.yml — kubegauge-agent CI: tests on PR/push; publishes multi-arch image + OCI chart on tag v*.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet + test
        run: |
          go vet ./...
          go test ./... -count=1
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/kubegauge-agent

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kubegauge/agent:${{ github.ref_name }}
            ghcr.io/kubegauge/agent:latest
          build-args: |
            VERSION=${{ github.ref_name }}
      - uses: azure/setup-helm@v4
      - name: publish the chart as OCI
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/kubegauge-agent --version "$VERSION" --app-version "$TAG"
          helm push "kubegauge-agent-$VERSION.tgz" oci://ghcr.io/kubegauge/charts
