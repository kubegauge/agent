# rbac.yaml — minimal read-only ClusterRole: exactly what snapshot.Take reads, verb list. No watch.
#
# secrets are deliberately ABSENT. RBAC cannot express "list metadata only", so a `list secrets`
# grant would make this ServiceAccount token a cluster-wide credential oracle for anyone who
# reached the pod — the pattern the agent's own KG-RB-006 fails a Role for. KG-RB-004 infers
# secret-bearing namespaces from references instead (see internal/checks/rbac.go).
#
# configmaps carry `list` because KG-SE-003 matches ConfigMap KEY NAMES, which no metadata-only
# projection provides; `get` alone would only serve the kube-system/kubeadm-config heuristic. Only
# key names ever leave the collector (internal/snapshot.ConfigMapMeta), never values. Set
# rbac.readConfigMapKeys=false to drop the verb: the collector degrades that one list gracefully
# and KG-SE-003 reports "na" instead of a verdict.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubegauge-agent.fullname" . }}
  labels:
    {{- include "kubegauge-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, serviceaccounts, services, resourcequotas, limitranges]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get{{ if .Values.rbac.readConfigMapKeys }}, list{{ end }}]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, clusterroles, rolebindings, clusterrolebindings]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubegauge-agent.fullname" . }}
  labels:
    {{- include "kubegauge-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubegauge-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubegauge-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
