# secret.yaml — the cluster API key, mounted into the pod as a file (--api-key-file).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubegauge-agent.fullname" . }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubegauge-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "apiKey is required — create the cluster in the KubeGauge dashboard to get one" .Values.apiKey | quote }}
