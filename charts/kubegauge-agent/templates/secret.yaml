{{- if not .Values.existingSecret }}
# secret.yaml — the cluster API key, mounted into the pod as a file (--api-key-file). Not rendered
# when existingSecret names a Secret you manage yourself: the chart then never handles the key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubegauge-agent.fullname" . }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubegauge-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKey }}: {{ required "apiKey is required — create the cluster in the KubeGauge dashboard to get one, or set existingSecret to a Secret you manage" .Values.apiKey | quote }}
{{- end }}
