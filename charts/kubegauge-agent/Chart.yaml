# Chart.yaml — metadata for the KubeGauge in-cluster agent chart.
apiVersion: v2
name: kubegauge-agent
description: Read-only KubeGauge agent — scans your cluster's security posture through the API server and pushes the report to the KubeGauge API. Outbound-only; no inbound connections.
type: application
# version tracks the release tag with the leading "v" stripped (CI packages the chart as
# --version ${TAG#v}); appVersion keeps the tag verbatim because that is how the image is
# published (ghcr.io/kubegauge/agent:v0.16.1). Both are asserted against the tag by CI on release
# and against each other by internal/chart's TestChartVersionsAgree.
version: 0.17.0
appVersion: "v0.17.0"
