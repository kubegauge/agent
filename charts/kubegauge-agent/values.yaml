# values.yaml — kubegauge-agent configuration (see README.md).

# Cluster name shown in the KubeGauge dashboard. Empty = release name.
clusterName: ""

# Base URL of the KubeGauge API this agent pushes to (REQUIRED). Must be https: the cluster API key
# travels in an Authorization header on every request. e.g. https://api.kubegauge.com
ingestUrl: ""

# Allow an http:// ingestUrl. Development only — with this on, the cluster API key travels in
# cleartext and anything on the path can steal it. The kind dev loop (make agent-dev, pushing to
# http://host.docker.internal:8080) is what this exists for.
allowInsecureHttp: false

# Cluster API key from the KubeGauge dashboard wizard. Required UNLESS existingSecret is set.
# Stored in a Secret created by this chart and mounted as a file; the key is shown exactly once at
# creation/rotation.
#
# Passing it here also writes it into Helm's release Secret, so anyone who can read that (or run
# `helm get values`) can recover the key. For a cluster where that matters, create the Secret
# yourself — from a secrets manager, sealed-secrets, external-secrets — and use existingSecret
# below instead.
apiKey: ""

# Name of a Secret you manage that holds the cluster API key. Set it and the chart creates no
# Secret of its own and never sees the key. The Secret must live in the release namespace.
existingSecret: ""
# Key inside that Secret holding the API key. Also the key the chart-managed Secret uses.
existingSecretKey: api-key

# Interval between full scans pushed to the API. Plan minimums are enforced server-side
# (free: 24h, pro/ai: 1h) — a faster interval here just earns polite 429s.
scanInterval: 1h

# Budget for one collection pass over the API server. Every list is paginated, so the default is
# generous enough for very large clusters; raise it if the logs show collection timeouts.
collectTimeout: 10m

rbac:
  # ConfigMaps are listed for their KEY NAMES only (never values) to feed KG-SE-003's
  # credential-name heuristic. Set to false to keep `get` (needed for the kube-system/kubeadm-config
  # distribution heuristic) and drop `list`: the agent degrades that collection gracefully and
  # KG-SE-003 reports N/A. Secrets are never granted at all — see the chart README.
  readConfigMapKeys: true

image:
  repository: ghcr.io/kubegauge/agent
  # Empty = chart appVersion. Release images carry a leading "v" (agent:v0.16.0); a bare semver set
  # here gets the prefix added for you, anything else (dev, latest) is used verbatim.
  tag: ""
  pullPolicy: IfNotPresent

trivy:
  # false => --no-trivy (KG-SU-003 degrades to info).
  enabled: true

# Dogfooding: the agent shows up in its own scan; requests/limits are part of passing it.
#
# ephemeral-storage is not decoration: trivy downloads databases measured in gigabytes into the two
# volumes below, so without a bound the pod could fill the node's disk and take its neighbours down
# with it. Two rules hold this together, both guarded by internal/chart's
# TestEphemeralStorageLimitClearsBothVolumes:
#
#   - the LIMIT stays above cacheSizeLimit + tmpSizeLimit with room to spare, because container
#     logs are charged to it as well. Chart 0.16.0 set it to exactly the sum (3Gi against 2Gi +
#     1Gi), which would have evicted the pod in the end even with correctly sized volumes.
#   - the REQUEST stays small. It is what the scheduler subtracts from a node's allocatable
#     storage, while the limit is only an eviction threshold and costs nothing at scheduling time,
#     so the agent keeps fitting on modest nodes.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 12Gi

# sizeLimit for the two emptyDir volumes, derived from what trivy 0.72.0 (the version in the agent
# image) actually stores. Sizes below were read from the published OCI artifacts on 2026-07-30:
#
#   cache  = TRIVY_CACHE_DIR plus the agent's own parsed-result cache
#            - vulnerability database, extracted ..... 1.14 GiB
#            - Java database, extracted .............. 1.39 GiB, fetched lazily the first time a
#                                                      scanned image contains a jar/war/ear
#            - trivy's scan cache and the agent's .... grows with the number of images scanned
#   tmp    = TMPDIR, where trivy writes each database's COMPRESSED blob before extracting it into
#            cache (103 MiB for the vulnerability database, 900 MiB for the Java one), plus the
#            scratch space it uses while unpacking an image, which scales with that image's size
#
# So a cluster running anything on the JVM holds about 2.5 GiB resident before a single result is
# cached, and both databases have grown steadily (the vulnerability download nearly doubled between
# 2024-10 and 2026-07). These defaults are therefore several times today's footprint on purpose,
# not a tight fit: they exist to catch runaway growth, not to budget normal operation.
#
# The asymmetry is the whole point. Setting these too low costs the agent permanently — the kubelet
# evicts the pod, the replacement downloads the databases and is evicted again, and the reason
# appears only in `kubectl describe pod`, never in the agent's logs. Chart 0.16.0 shipped
# cacheSizeLimit 2Gi, below the two databases together, and did exactly that to every cluster with
# trivy enabled. Setting them high only delays catching a genuine leak, which the result cache's
# TTL eviction already bounds on the agent's side.
#
# Raise cacheSizeLimit if the agent's "trivy cache on disk" log line gets close to it, and
# tmpSizeLimit if your images are unusually large. Raise the ephemeral-storage limit above to match.
cacheSizeLimit: 8Gi
tmpSizeLimit: 3Gi

# Deny every inbound connection to the agent pod. The agent only ever makes outbound requests, but
# it does bind 0.0.0.0:8787 for kubelet probes, and without a policy any pod can reach that port.
# Off by default because probe traffic comes from the node and not every CNI treats host-to-pod
# traffic the same way: on one that polices it, this makes the probes fail. Turn it on, then check
# the pod stays Ready. Egress is untouched either way.
networkPolicy:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
